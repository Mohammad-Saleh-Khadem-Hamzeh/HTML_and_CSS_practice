<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./100.css">
    <title>loginpage</title>
</head>
<body>
    <div class="lg">
        <h3>فرم ثبت نام مجموعه</h3>
        <form action="#">   
            <label for="fname" id="faname">نام:</label>
            <input type="fname" id="fname" name="fname" required placeholder="محمد">
            <label for="lname" id="laname">نام خانوادگی:</label>
            <input type="text" id="lname" name="lname" required>
            <label for="phone" id="ophone">شماره تلفن:</label>
            <input type="phone" id="phone" name="phone" required placeholder="09xxxxxxxxx"><br>
            <label for="ghnon" id="oghnon">من تمام قوانین  و ضوابط سایت را می پذیرم.</label>
            <input type="checkbox" id="ghnon" name="ghnon" required>
            <br>
            <button>ثبت نام</button>
        </form>
    </div>
</body>
</html>
